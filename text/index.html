<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Text a lead | Brynion Excavation</title><link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#072630">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#072630;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}main{max-width:420px;width:100%}img{width:180px;height:auto;margin-bottom:28px}h1{font-size:22px;margin:0 0 8px}p{margin:0 0 22px;color:#cfe3ea}a.b{display:block;background:#0286B2;color:#fff;font-weight:700;font-size:18px;padding:16px 20px;border-radius:8px;text-decoration:none;margin-bottom:12px}a.c{display:block;border:2px solid #5BC0E8;color:#fff;font-weight:700;padding:13px 20px;border-radius:8px;text-decoration:none}.n{font-size:28px;font-weight:800;letter-spacing:.02em;margin:0 0 18px;color:#fff}</style></head>
<body><main><img src="/assets/brand/brynion-logo-reverse.svg" alt="Brynion Excavation logo" onerror="this.remove()"><h1 id="h">Opening Messages…</h1><p class="n" id="num"></p><p id="msg">If your Messages app didn't open, tap the button below.</p><a class="b" id="sms" href="#">Text this lead</a><a class="c" id="tel" href="#">Call instead</a></main>
<script>(function(){var q=new URLSearchParams(location.search),d=(q.get('to')||'').replace(/\D/g,'').slice(-10),nm=(q.get('name')||'').replace(/[^\w .'-]/g,'').slice(0,40);
if(d.length!==10){document.getElementById('h').textContent='No phone number found';document.getElementById('msg').textContent='This link is missing the lead\'s phone number. Check the lead email.';document.getElementById('sms').remove();document.getElementById('tel').remove();return}
var body='Hi'+(nm?' '+nm:'')+', this is Taylor with Brynion Excavation following up on your estimate request.';
var ios=/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document;
var url='sms:+1'+d+(ios?'&':'?')+'body='+encodeURIComponent(body);
document.getElementById('num').textContent='('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);
document.getElementById('sms').href=url;document.getElementById('tel').href='tel:+1'+d;
setTimeout(function(){location.href=url},150);})();</script></body></html>
